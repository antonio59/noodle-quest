name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install
      - run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install
      - run: pnpm run build

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm run test:e2e

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install
      - run: pnpm audit --audit-level=high
        continue-on-error: true
