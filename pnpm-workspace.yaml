packages:
  - .

allowBuilds:
  esbuild: true

pnpm:
  legacyPeerDeps: true
  packageImportMethod: clone-or-copy

# Pin transitive dependencies to patched versions to clear security
# advisories (these come in via convex / vite / babel / browserslist):
#   ws                      >=8.21.0  GHSA-96hv-2xvq-fx4p (DoS)
#   esbuild                 >=0.28.1  GHSA-gv7w-rqvm-qjhr (RCE)
#   @babel/core             ^7.29.6   GHSA-4x5r-pxfx-6jf8 (arbitrary file read)
#   react-router            ^7.18.2   GHSA-qwww-vcr4-c8h2 and related 7.17.x CVEs
#   undici                  ^7.30.1   GHSA-4cwx-7wf7-3272, CVE-2026-109869 / CVE-2026-109924 / CVE-2026-109841
#   baseline-browser-mapping ^2.11.0  CVE-2026-45819 (process.exit DoS)
#   browserslist            ^4.28.7   CVE-2026-73088 / CVE-2026-73089
#   postcss                 ^8.5.23   CVE-2026-73646 / CVE-2026-69153
#   brace-expansion         ^5.0.12   CVE-2026-102276 / CVE-2026-102277 / CVE-2026-102278
#   source-map-js           >=1.2.2   CVE-2026-93749 (indexed source-map DoS)
#   nanoid                  ^3.3.18   CVE-2026-67213 / CVE-2026-67214
#   zod                     ^4.6.6    CVE-2023-54404 (oversized collection validation)
#   vitest / @vitest/mocker ^4.1.12   GHSA-qxg6-89mg-rqv8 / GHSA-xp26-3454-mjgp
overrides:
  ws: ">=8.21.0"
  esbuild: "^0.28.1"
  "@babel/core": "^7.29.6"
  react-router: "^7.18.2"
  undici: "^7.30.1"
  baseline-browser-mapping: "^2.11.0"
  browserslist: "^4.28.7"
  postcss: "^8.5.23"
  brace-expansion: "^5.0.12"
  source-map-js: ">=1.2.2"
  nanoid: "^3.3.18"
  zod: "^4.6.6"
  vitest: "^4.1.12"
  "@vitest/mocker": "^4.1.12"
